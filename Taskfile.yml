version: '3'

silent: true

tasks:
  test:
    desc: "Starts a test server and runs a unit/integration test suite against it."
    cmds:
      - .tasks/setup-test-server.sh
      - echo "[+] Running tests..."
      - bash -lc 'set -o pipefail; swift test -q 2>&1 | grep --line-buffered -E "^Test Case .* failed|Executed [0-9]+ tests, with"'
      - .tasks/shutdown-test-server.sh

